services:
  composegen:
    build:
      context: ./composegen
      dockerfile: Dockerfile
    volumes:
      - ./composegen:/app
      - ./fuzzer/configs:/configs
    environment:
      PYTHONUNBUFFERED: 1

  hargen:
    build:
      context: ./hargen
      dockerfile: Dockerfile
    volumes:
      - ./hargen:/app:ro
      - ./fuzzer/resources:/resources:ro
      - ./fuzzer/configs:/configs
    environment:
      PYTHONUNBUFFERED: 1
    stdin_open: true # docker run -i
    tty: true # docker run -t

  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    volumes:
      - ./crawler:/app:rw
      - ./fuzzer/automated_logins:/automated_logins:ro
    environment:
      PYTHONUNBUFFERED: 1
    stdin_open: true # docker run -i
    tty: true # docker run -t

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      APPLICATION_TYPE: dvwa
      FUZZER_COVERAGE_PATH: /var/www/html/
      FUZZER_COMPRESS: 1
      REQUIRES_DB: 1
      #APPLICATION_TYPE: dvwa
      #FUZZER_COVERAGE_PATH: /var/www/html/
      #WP_TARGET_PLUGIN: show-all-comments-in-one-page
    volumes:
      - ./web/applications:/applications/
      - shared-tmpfs:/shared-tmpfs
    ports:
      - 8080:80
      - 8181:8181

  db:
    image: mysql
    command: mysqld
    environment:
      MYSQL_DATABASE: db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
      MYSQL_ROOT_HOST: "%"
      MYSQL_USER_HOST: "%"

  mongodb:
    image: mongo:latest
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: mymdb
    ports:
    - "27017:27017"

  # The following code for openldap and phpldapadmin is from https://medium.com/@devripper133127/setting-up-openldap-and-phpldapadmin-with-docker-compose-cf2336590989.
  openldap:
    image: osixia/openldap:latest
    container_name: openldap
    environment:
      LDAP_BASE_DN: "dc=example,dc=org"
      LDAP_ORGANISATION: "Example Organization"
      LDAP_DOMAIN: "example.org"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_TLS: "false"             
    volumes:
      - ./ldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bootstrap.ldif
    ports:
      - "389:389"                   
    command: --copy-service
    restart: unless-stopped
    
  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"  
    ports:
      - "8081:80"
    restart: unless-stopped
    depends_on:
      - openldap

  #burpsuite:
  #  build:
  #    context: ./burpsuite
  #    dockerfile: Dockerfile
  #  environment:
  #    FUZZER_CONFIG: bwapp/ldapi
  #  volumes:
  #    - ./fuzzer:/app
  #    - ./burpsuite/data:/home/burp/data
  #    - ./burpsuite/.java:/home/burp/.java
  #  stdin_open: true # docker run -i
  #  tty: true # docker run -t

  zap:
    build:
      context: ./zap
      dockerfile: Dockerfile
    environment:
      FUZZER_CONFIG: bwapp/ldapi
    volumes:
      - ./fuzzer:/app
      - ./zap/data:/zap/data
    stdin_open: true # docker run -i
    tty: true # docker run -t

  wapiti:
    build:
      context: ./wapiti
      dockerfile: Dockerfile
    environment:
      FUZZER_CONFIG: bwapp/ldapi
    volumes:
      - ./fuzzer:/app
      - ./wapiti/data:/home/wapiti/data
    stdin_open: true # docker run -i
    tty: true # docker run -t

  wfuzz:
    build:
      context: ./wfuzz
      dockerfile: Dockerfile
    environment:
      FUZZER_CONFIG: bwapp/ldapi
    volumes:
      - ./fuzzer:/app
      - ./wfuzz/data:/home/wfuzz/data
    stdin_open: true # docker run -i
    tty: true # docker run -t


  fuzzer-dvwa-sqli-low-1:
    build:
